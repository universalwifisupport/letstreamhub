<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18226007634"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-18226007634');
    </script>
    <script>
      // Single Page Apps for GitHub Pages
      // This script takes the current url and converts the path and query
      // string into just another part of a url's query
      // This way, when the browser hits 404, it redirects to the root
      // with the correct path/query as a query param, which the
      // router can then use to navigate to the correct page.
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <meta http-equiv="refresh" content="0;URL='/?/~and~/'" />
  </head>
  <body>
  </body>
</html>
